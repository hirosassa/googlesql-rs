[package]
name = "googlesql"
version = "0.3.1"
edition = "2024"
# Driven by the wasmtime 47 dependency tree, whose crates require Rust 1.94.
rust-version = "1.94"
description = "Rust bindings for GoogleSQL (ZetaSQL) via a prebuilt WebAssembly module"
license = "Apache-2.0"
repository = "https://github.com/hirosassa/googlesql-rs"
readme = "README.md"
# Under `native-ffi` this crate links the prebuilt `guest_ffi` C-ABI cdylib.
# Declaring it via `links` both dedups that native library across the graph and
# lets `build.rs` hand the resolved library directory to consumers as
# `DEP_GUEST_FFI_LIBDIR`, which they turn into an `-rpath` so their binaries and
# tests find the cdylib at runtime (see docs/NATIVE.md). Harmless for the
# default wasmtime build, which emits no link directives.
links = "guest_ffi"
keywords = ["googlesql", "zetasql", "sql", "parser", "wasm"]
categories = ["database", "parser-implementations", "api-bindings"]
# Keep development-only files out of the published crate.
exclude = [".github/", ".workspace_cache/", "codecov.yml"]

[workspace]
# `native/guest` is an optional path-dependency that lives inside this repo, so
# Cargo would otherwise auto-include the ~2.6M-LOC generated crate as a workspace
# member: `cargo fmt --all` overflows rustfmt's stack on it, and `--workspace` /
# `--all` operations would needlessly descend into it. It is still built as a
# dependency under the `native` feature (and the `[profile.*.package.guest]`
# overrides still apply); excluding it only drops it from member operations.
# `native/guest-ffi` is the C-ABI cdylib (its own workspace root); it is never a
# Cargo dependency of this crate — it is built separately and linked — so exclude
# it too, keeping parent `--workspace`/`fmt --all` out of it.
exclude = ["native/guest", "native/guest-ffi"]

# docs.rs builds offline, but the default feature is now `native-ffi`, which
# links a prebuilt cdylib fetched from a GitHub Release — a network operation
# that docs.rs's sandbox blocks. So document an explicit feature set instead of
# the default: `wasmtime` (whose wasm fetch build.rs already skips under DOCS_RS)
# plus `native-ffi` for its constructor's docs (build.rs skips the cdylib link
# under DOCS_RS too, and `cargo doc` never links, so the missing cdylib is fine).
# The `native` feature is still omitted: it needs the generated `guest` crate
# docs.rs cannot produce.
[package.metadata.docs.rs]
no-default-features = true
features = ["wasmtime", "native-ffi"]

[dependencies]
# The wasmtime engine is now optional, gated behind the `wasmtime` feature. The
# published default is `native-ffi` (a prebuilt cdylib), so a plain `cargo add`
# no longer pulls the heavy wasmtime/cranelift tree; opt into `wasmtime` to use
# the JIT/interpreter engine (or to run the differential tests against it).
wasmtime = { version = "47", optional = true }
wasmtime-wasi = { version = "47", optional = true }
thiserror = "2"
# The `native` backend: googlesql.wasm transpiled to standalone Rust by wasm2rs
# and linked directly (no wasm runtime). The generated crate is huge (~122MB /
# 2.6M LOC) and lives in the gitignored `native/guest`, regenerated by
# scripts/gen-native-guest.sh. Opt-in and off by default: the default build uses
# the wasmtime engine only and never touches this dependency.
guest = { path = "native/guest", optional = true }

[features]
# The published default. Reaches the native engine through a prebuilt C-ABI
# cdylib and does NOT pull the wasmtime tree, so the default build is light. See
# the `native-ffi` entry below for how the cdylib is resolved.
default = ["native-ffi"]
# The wasmtime engine (JIT/interpreter). Optional since the default backend is
# `native-ffi`. Enabling it unlocks `Module::new()`'s wasmtime path (see the cfg
# dispatch in `src/runtime.rs`) and is what the differential tests compare the
# native backends against, so those runs enable it alongside `native`/
# `native-ffi` (e.g. `--features wasmtime,native-ffi`).
wasmtime = ["dep:wasmtime", "dep:wasmtime-wasi"]
# Additive: enabling `native` compiles the wasm2rs backend and unlocks
# `Module::new_native()`. Independent of `wasmtime` — combine the two
# (`--features native,wasmtime`) to construct both engines for the differential
# tests.
native = ["dep:guest"]
# The native engine reached through a C-ABI cdylib instead of the `guest`
# path-dependency. Unlocks `Module::new_native_ffi()` and links a prebuilt
# `guest-ffi` shared library. Unlike `native`, this does NOT pull the `guest`
# crate into this build — the optimized object code lives in the linked cdylib,
# which `build.rs` resolves from `GUEST_FFI_LIB` or downloads from a Release.
# A cdylib links cleanly under any consumer rustc (its `std` stays internal); see
# docs/NATIVE.md.
native-ffi = []

[build-dependencies]
sha2 = "0.11"
# Used to precompile googlesql.wasm into a `.cwasm` at build time so the runtime
# deserializes native code instead of JIT-compiling on first use. Kept at the
# same version and default features as the runtime `wasmtime` dependency: the
# `.cwasm` compatibility check hashes the enabled wasm proposals, so a feature
# mismatch would make every runtime `deserialize` fail and fall back to JIT.
# Optional and gated by the `wasmtime` feature (via `dep:wasmtime`), so the
# default `native-ffi`-only build never compiles the wasmtime tree at build time
# either; build.rs only touches it under `#[cfg(feature = "wasmtime")]`.
wasmtime = { version = "47", optional = true }
# Decompresses the prebuilt `guest-ffi` cdylib downloaded from a Release under the
# `native-ffi` feature (assets are shipped zstd-compressed, ~20MB vs ~56MB raw).
zstd = "0.13"

[dev-dependencies]
criterion = "0.8"

# Benchmarks live in benches/queries.rs and use criterion's own harness. They
# are excluded from `cargo test`; run them explicitly with `cargo bench`.
[[bench]]
name = "queries"
harness = false

# Coverage instruments a debug build of every dependency, including the large
# wasmtime/cranelift tree. Full debug info dominates that build's compile and
# link time while coverage only needs line tables, so drop the rest.
[profile.dev]
debug = "line-tables-only"

# Coverage runs the tests under this profile, and each test binary JIT-compiles
# the ~13MB wasm module via wasmtime. An unoptimized (and coverage-instrumented)
# cranelift makes that JIT take ~2 min per binary, which dominated the whole
# coverage job. Optimize dependencies while leaving our own crate at opt-level 0
# so line coverage stays accurate.
[profile.dev.package."*"]
opt-level = 3

# The wasm2rs-generated `guest` crate is ~2.6M LOC. Optimizing it (the `*`
# override above would force opt-level 3) makes a debug/test build take tens of
# minutes; the native backend only needs correctness, so build it unoptimized.
# Real native performance is a later concern (prebuilt artifacts).
[profile.dev.package.guest]
opt-level = 0

# Under the `native` feature, this crate monomorphizes and inlines the huge
# `guest` generics; generating even line-tables debug info for that overflows
# LLVM's DWARF scope emitter (SIGBUS). Drop debug info for our own crate (only
# under dev/test builds) — it does not affect the deps' cached artifacts.
[profile.dev.package.googlesql]
debug = 0
[profile.test.package.googlesql]
debug = 0

# The release profile disables overflow checks by default; re-enable them as a
# runtime backstop behind the compile-time `arithmetic_side_effects` ban.
[profile.release]
overflow-checks = true

[lints.rust]
# Turn every compiler warning into a hard error (matches CI's `-D warnings`).
warnings = "deny"
# This crate has no FFI and drives wasmtime through its safe API, with a single
# exception: deserializing the build-time `.cwasm` (`Module::deserialize_file` is
# `unsafe`). That one call carries a localized `#[allow(unsafe_code, reason=…)]`,
# so unsafe is denied rather than forbidden to let that documented allow stand.
unsafe_code = "deny"

[lints.clippy]
# rust-hardening: forbid panicking constructs in non-test code.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unwrap_in_result = "deny"
# Arithmetic and cast safety: no silent overflow, wrap, or truncation.
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "warn"
# Float foot-guns.
float_cmp = "deny"
lossy_float_literal = "deny"
# Don't silently drop a fallible result.
let_underscore_must_use = "deny"
# Suppression hygiene: every #[allow]/#[expect] must carry a `reason = "…"`.
allow_attributes_without_reason = "deny"

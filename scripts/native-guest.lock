# Pinned prebuilt native guest — the wasm2rs-generated `guest` crate plus the
# dispatch table, distributed via GitHub Releases so the `native` feature can be
# built without the wasm2rs / wasm-tools / python toolchain.
#
# Content-addressed: CONTENT_SHA256 is the canonical hash of the generated tree
# (scripts/native-guest-digest.sh), reproducible from the two pinned inputs
# below, so integrity is verified on file CONTENT — not the non-reproducible
# tar/gzip framing that transports it. wasm2rs output is deterministic, so
# regenerating from the same inputs yields the same digest.
#
# Generated from:
#   googlesql.wasm  v0.4.0  (the SHA-pinned module resolved by build.rs)
#   wasm2rs         v0.2.0 (5d3e4d47e75add758bfeb38a7967b7d78aec8f55)
#
# When either input moves, regenerate, update CONTENT_SHA256 (and RELEASE_TAG /
# TARBALL_URL), and republish with .github/workflows/release-native-guest.yaml.
WASM_VERSION=v0.4.0
WASM2RS_REF=5d3e4d47e75add758bfeb38a7967b7d78aec8f55
CONTENT_SHA256=fcba720a0b6f8254b1c77693c6605d3cf5a8d6c35040b137d0abddee419a8ab5
RELEASE_TAG=native-guest-v0.4.0-5d3e4d4
TARBALL_NAME=native-guest.tar.gz
TARBALL_URL=https://github.com/hirosassa/googlesql-rs/releases/download/native-guest-v0.4.0-5d3e4d4/native-guest.tar.gz

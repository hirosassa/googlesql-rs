version: 2
updates:
  # Rust crate dependencies (Cargo.toml / Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  # GitHub Actions used by the workflows in .github/workflows.
  # Actions are referenced by tag (`@vX.Y.Z`) and pinned to commit SHAs in
  # .github/workflows/actions.lock. After a bump, run `gh actions-lock` to
  # refresh the lockfile (the verify-lockfile workflow enforces this).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # Batch all action bumps into a single PR to reduce review churn.
    groups:
      github-actions:
        patterns:
          - "*"

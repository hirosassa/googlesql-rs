name: native

# Opt-in validation of the `native` (wasm2rs) backend. It is NOT part of the
# default matrix: enabling `native` pulls in the ~122MB / 2.6M-LOC generated
# `guest` crate, which is regenerated here from the SHA-pinned googlesql.wasm
# rather than committed. Runs on demand and on PRs that touch the native wiring.
on:
  workflow_dispatch:
  # Seed the cache on the default branch: GitHub Actions caches are branch-scoped,
  # and a PR can only restore caches from its own branch or the base/default
  # branch. Without a run on `main`, every PR starts cold ("No cache found").
  # Running the same path-filtered job on push to `main` populates a cache the
  # restore-key prefix shares, so later PRs hit it. (Saving is gated to `main`
  # via `save-if` on the rust-cache steps, so PRs restore-only.)
  push:
    branches: [ main ]
    # Anchor the shared path filter here (the first occurrence), aliased by
    # `pull_request` below. An anchor must be defined before it is referenced.
    paths: &native_paths
      - 'src/native_backend.rs'
      - 'src/runtime.rs'
      - 'src/lib.rs'
      - 'Cargo.toml'
      - 'native/guest/Cargo.toml'
      # The pinned wasm URL/SHA the fetch step reads from build.rs — a version
      # bump there changes which module native compares against, so revalidate.
      - 'build.rs'
      - 'scripts/gen-native-guest.sh'
      - 'scripts/gen-native-dispatch.py'
      - '.github/workflows/native.yaml'
      # The prebuilt-distribution scripts and their pin, validated by the
      # `prebuilt` job below.
      - 'scripts/native-guest-digest.sh'
      - 'scripts/pack-native-guest.sh'
      - 'scripts/fetch-native-guest.sh'
      - 'scripts/native-guest.lock'
      # The native-ffi (C-ABI cdylib) backend and its fetch/link plumbing,
      # validated by the `native-ffi` job below.
      - 'src/native_ffi_backend.rs'
      - 'build_helpers.rs'
      - 'native/guest-ffi/**'
      - 'tests/native_ffi.rs'
      - 'tests/build_helpers.rs'
      - 'scripts/update-native-ffi-pins.sh'
      - '.github/workflows/native-ffi-release.yml'
  pull_request:
    branches: [ main ]
    paths: *native_paths

env:
  CARGO_TERM_COLOR: always
  # The wasm2rs revision to transpile with. `main` tracks the latest generator;
  # pin to a SHA here if a specific generator output must be reproduced.
  WASM2RS_REF: main
  # The fetch step writes the pinned wasm here; every cargo step reads it so the
  # native dispatch and the wasmtime engine compare the identical module.
  GOOGLESQL_WASM: /tmp/googlesql.wasm

jobs:
  native:
    name: native backend (wasm2rs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout googlesql-rs
        uses: actions/checkout@v7
        with:
          path: googlesql-rs

      - name: Checkout wasm2rs
        uses: actions/checkout@v7
        with:
          repository: hirosassa/wasm2rs
          ref: ${{ env.WASM2RS_REF }}
          path: wasm2rs

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Enable rustc's parallel frontend
        # The generated `guest` crate is ~2.6M LOC, and its single-threaded
        # type/borrow check dominates every native build here. `-Zthreads` runs
        # that frontend across all cores (locally ~776s -> ~362s); it only
        # parallelises the frontend, so codegen output is byte-identical and the
        # differential tests below stay valid. The flag is nightly-only, so
        # RUSTC_BOOTSTRAP=1 opts stable into it. Written to $GITHUB_ENV so every
        # cargo step in this job inherits it.
        run: |
          {
            echo "RUSTC_BOOTSTRAP=1"
            echo "RUSTFLAGS=-Zthreads=$(nproc)"
          } >>"$GITHUB_ENV"

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Cache cargo and the generated guest build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: googlesql-rs
          # The huge `guest` rlib dominates; a dedicated prefix keeps it off the
          # default matrix's cache. wasm2rs's revision changes the generated
          # sources, so key on it to rebuild the guest when the generator moves.
          prefix-key: "native-${{ env.WASM2RS_REF }}"
          # Only the `main` run writes the cache; PRs restore it read-only. This
          # avoids per-PR-branch cache entries (which no other PR can restore
          # anyway) and keeps the shared, PR-restorable cache seeded from `main`.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fetch the pinned googlesql.wasm (same version the build downloads)
        working-directory: googlesql-rs
        run: |
          set -euo pipefail
          # Source URL and SHA from build.rs so the native dispatch and the
          # wasmtime engine stay locked to one wasm; drift can only come from an
          # explicit build.rs bump.
          url=$(grep -oP 'https://github\.com/goccy/[^"]+\.wasm' build.rs)
          sha=$(grep -oP 'WASM_SHA256: &str = "\K[0-9a-f]+' build.rs)
          echo "wasm: $url"
          curl -sSL "$url" -o /tmp/googlesql.wasm
          echo "${sha}  /tmp/googlesql.wasm" | sha256sum -c -

      - name: Generate the native guest crate and dispatch table
        working-directory: googlesql-rs
        env:
          WASM2RS_DIR: ${{ github.workspace }}/wasm2rs
        run: scripts/gen-native-guest.sh

      - name: Clippy (native backend)
        working-directory: googlesql-rs
        run: cargo clippy --all-targets --features native -- -D warnings -W clippy::nursery

      - name: Differential tests vs wasmtime
        working-directory: googlesql-rs
        # The in-crate differential tests, then the public-API smoke test in
        # tests/native.rs (the `native_backend::` name filter above does not
        # select integration targets, so it runs as a separate invocation).
        run: |
          cargo test --features native --lib 'native_backend::'
          cargo test --features native --test native

  prebuilt:
    name: native prebuilt (fetch roundtrip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout googlesql-rs
        uses: actions/checkout@v7
        with:
          path: googlesql-rs

      - name: Read the pins from the lock
        id: pins
        working-directory: googlesql-rs
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source scripts/native-guest.lock
          {
            echo "wasm2rs_ref=$WASM2RS_REF"
            echo "content_sha256=$CONTENT_SHA256"
          } >>"$GITHUB_OUTPUT"

      # Reproduce the guest at the lock's pinned wasm2rs ref (not the workflow's
      # `main`), so the regenerated digest can be asserted against the lock.
      - name: Checkout wasm2rs (pinned ref)
        uses: actions/checkout@v7
        with:
          repository: hirosassa/wasm2rs
          ref: ${{ steps.pins.outputs.wasm2rs_ref }}
          path: wasm2rs

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Fetch the pinned googlesql.wasm
        working-directory: googlesql-rs
        run: |
          set -euo pipefail
          url=$(grep -oP 'https://github\.com/goccy/[^"]+\.wasm' build.rs)
          sha=$(grep -oP 'WASM_SHA256: &str = "\K[0-9a-f]+' build.rs)
          curl -fsSL --retry 3 "$url" -o /tmp/googlesql.wasm
          echo "${sha}  /tmp/googlesql.wasm" | sha256sum -c -

      - name: Generate the guest
        working-directory: googlesql-rs
        env:
          # Also set at workflow level; kept explicit here so this step reads as
          # self-contained (the fetch step above writes the wasm to this path).
          GOOGLESQL_WASM: /tmp/googlesql.wasm
          WASM2RS_DIR: ${{ github.workspace }}/wasm2rs
        run: scripts/gen-native-guest.sh

      - name: Reproducibility — the generated tree matches the pinned digest
        working-directory: googlesql-rs
        run: |
          set -euo pipefail
          actual=$(scripts/native-guest-digest.sh)
          echo "content digest: $actual"
          if [[ "$actual" != "${{ steps.pins.outputs.content_sha256 }}" ]]; then
            echo "error: generated tree does not match CONTENT_SHA256 in the lock" >&2
            exit 1
          fi

      - name: Pack the tarball (as the release workflow would)
        working-directory: googlesql-rs
        run: scripts/pack-native-guest.sh /tmp/native-guest.tar.gz

      # Wipe the generated sources but keep the committed guest/Cargo.toml, so the
      # tree looks like a fresh checkout before the fetch script provisions it.
      - name: Simulate a fresh checkout
        working-directory: googlesql-rs
        run: |
          set -euo pipefail
          find native/guest -type f ! -name Cargo.toml -delete
          rm -f native/dispatch.rs

      - name: Fetch from the local tarball and verify the digest
        working-directory: googlesql-rs
        env:
          GUEST_TARBALL: /tmp/native-guest.tar.gz
        run: scripts/fetch-native-guest.sh

      # The extracted tree is byte-identical (digest-verified) to the one the
      # `native` job compiles, so resolving the path-dependency is enough here;
      # buildability is already covered there.
      - name: Cargo resolves the provisioned guest under --features native
        working-directory: googlesql-rs
        run: cargo metadata --features native --format-version 1 >/dev/null

  native-ffi:
    name: native-ffi backend (C-ABI cdylib)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout googlesql-rs
        uses: actions/checkout@v7
        with:
          path: googlesql-rs

      - name: Checkout wasm2rs
        uses: actions/checkout@v7
        with:
          repository: hirosassa/wasm2rs
          ref: ${{ env.WASM2RS_REF }}
          path: wasm2rs

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Enable rustc's parallel frontend
        # The generated `guest` crate is ~2.6M LOC, and its single-threaded
        # type/borrow check dominates every native build here. `-Zthreads` runs
        # that frontend across all cores (locally ~776s -> ~362s); it only
        # parallelises the frontend, so codegen output is byte-identical and the
        # differential tests below stay valid. The flag is nightly-only, so
        # RUSTC_BOOTSTRAP=1 opts stable into it. Written to $GITHUB_ENV so every
        # cargo step in this job inherits it.
        run: |
          {
            echo "RUSTC_BOOTSTRAP=1"
            echo "RUSTFLAGS=-Zthreads=$(nproc)"
          } >>"$GITHUB_ENV"

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Cache cargo and the generated guest build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            googlesql-rs
            googlesql-rs/native/guest-ffi
          prefix-key: "native-ffi-${{ env.WASM2RS_REF }}"
          # Only the `main` run writes the cache; PRs restore it read-only (see
          # the `native` job above for the rationale).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fetch the pinned googlesql.wasm
        working-directory: googlesql-rs
        run: |
          set -euo pipefail
          url=$(grep -oP 'https://github\.com/goccy/[^"]+\.wasm' build.rs)
          sha=$(grep -oP 'WASM_SHA256: &str = "\K[0-9a-f]+' build.rs)
          curl -fsSL --retry 3 "$url" -o /tmp/googlesql.wasm
          echo "${sha}  /tmp/googlesql.wasm" | sha256sum -c -

      - name: Generate the native guest crate and dispatch table
        working-directory: googlesql-rs
        env:
          WASM2RS_DIR: ${{ github.workspace }}/wasm2rs
        run: scripts/gen-native-guest.sh

      # A dev-profile cdylib (not the opt-level-3 release artifact the Release
      # workflow ships) — this job checks the FFI wiring and the fetch/link path,
      # not performance, so the far cheaper build is enough.
      - name: Build the guest-ffi cdylib (dev profile)
        working-directory: googlesql-rs
        run: cargo build --manifest-path native/guest-ffi/Cargo.toml

      - name: Unit-test the build helpers
        working-directory: googlesql-rs
        run: cargo test --test build_helpers

      - name: Clippy (native-ffi backend)
        working-directory: googlesql-rs
        env:
          GUEST_FFI_LIB: ${{ github.workspace }}/googlesql-rs/native/guest-ffi/target/debug
        run: cargo clippy --all-targets --features native-ffi -- -D warnings -W clippy::nursery

      - name: Differential test vs wasmtime (GUEST_FFI_LIB override)
        working-directory: googlesql-rs
        env:
          GUEST_FFI_LIB: ${{ github.workspace }}/googlesql-rs/native/guest-ffi/target/debug
        run: cargo test --features native-ffi --test native_ffi

      # Exercise the download path build.rs takes for a released consumer: lay the
      # compressed cdylib out as a `file://` Release, pin its checksum, and link
      # with no GUEST_FFI_LIB so the fetch → zstd-decode → SHA-verify → link chain
      # runs for real.
      - name: Differential test via the download+verify path (file:// Release)
        working-directory: googlesql-rs
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zstd
          fi
          host=$(rustc -vV | sed -n 's/^host: //p')       # x86_64-unknown-linux-gnu
          tag=$(grep -oP 'NATIVE_FFI_TAG: &str = "\K[^"]+' build.rs)
          dylib="native/guest-ffi/target/debug/libguest_ffi.so"
          sha=$(sha256sum "$dylib" | awk '{print $1}')
          rel="/tmp/native-ffi-rel"
          mkdir -p "$rel/$tag"
          zstd -q -19 -f -o "$rel/$tag/libguest_ffi-${host}.so.zst" "$dylib"
          # Pin the just-built checksum for this host target, then link with the
          # download path (no GUEST_FFI_LIB in the environment).
          echo "${host} ${sha}" | scripts/update-native-ffi-pins.sh "$tag"
          env -u GUEST_FFI_LIB GUEST_FFI_URL_BASE="file://$rel" \
            cargo test --features native-ffi --test native_ffi

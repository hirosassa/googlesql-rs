name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check on ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v6

      - name: Install ${{ matrix.rust }}
        id: toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}
          echo "rustc=$(rustc -V | sed 's/[^a-zA-Z0-9._-]/-/g')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Rotate the cache key on the exact rustc build. Nightly's compiler
          # changes daily and Cargo fingerprints embed its commit, so a single
          # shared entry leaves the heavy wasmtime/cranelift dep tree cold on
          # every nightly run (~3x slower than stable). Keying on `rustc -V`
          # means each toolchain build gets its own entry that is saved warm and
          # reused until the next rotation; stable/beta rarely change, so their
          # caches stay warm as before.
          key: ${{ steps.toolchain.outputs.rustc }}

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::nursery

      - name: Run cargo doc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Run cargo test
        run: cargo test --release

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache prunes target/ before saving and does not understand the
          # custom target/llvm-cov-target directory, so it silently drops the
          # instrumented tree. Let it cache the registry only (prefix-key keeps
          # it off the build matrix's key) and cache the target explicitly below.
          prefix-key: "cov"
          cache-targets: false
          save-if: true

      - name: Cache llvm-cov instrumented target
        uses: actions/cache@v6
        with:
          # Persist the instrumented wasmtime/cranelift tree wholesale so only
          # changed workspace crates recompile. Key on Cargo.lock AND Cargo.toml
          # so a profile change (e.g. the deps' opt-level) rotates the key and
          # the rebuilt tree gets saved; the restore-key fallback still warms the
          # build from the previous tree.
          path: target/llvm-cov-target
          key: llvm-cov-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: llvm-cov-target-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

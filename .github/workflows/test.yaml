name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check on ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install ${{ matrix.rust }}
        id: toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}
          echo "rustc=$(rustc -V | sed 's/[^a-zA-Z0-9._-]/-/g')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          # Rotate the cache key on the exact rustc build. Nightly's compiler
          # changes daily and Cargo fingerprints embed its commit, so a single
          # shared entry leaves the heavy wasmtime/cranelift dep tree cold on
          # every nightly run (~3x slower than stable). Keying on `rustc -V`
          # means each toolchain build gets its own entry that is saved warm and
          # reused until the next rotation; stable/beta rarely change, so their
          # caches stay warm as before.
          key: ${{ steps.toolchain.outputs.rustc }}

      - name: Run cargo fmt
        # Scoped to this package, not `--all`: the in-repo `native/guest`
        # path-dependency is excluded from the workspace, but `cargo fmt --all`
        # still descends into its ~2.6M-LOC generated sources and overflows
        # rustfmt's stack. This crate is the only real member anyway.
        run: cargo fmt -- --check

      - name: Run cargo clippy
        # Pinned to the `wasmtime` engine (the published default is now the
        # `native-ffi` cdylib, which this offline job cannot link). The `native`
        # and `native-ffi` backends — and their differential tests against
        # wasmtime — are linted and tested in the dedicated `native` workflow.
        run: cargo clippy --all-targets --no-default-features --features wasmtime -- -D warnings -W clippy::nursery

      - name: Run cargo doc
        # Match docs.rs's feature set so doc-comment breakage surfaces here first.
        run: cargo doc --no-deps --no-default-features --features wasmtime
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Run cargo test
        run: cargo test --release --no-default-features --features wasmtime

  # The `bundled-tzdb` code path (windows-only by cfg, unix-only by feature)
  # is invisible to the job above: on linux `cfg(windows)` never fires and the
  # plain `wasmtime` feature set leaves the whole block uncompiled. Lint and
  # test it explicitly here, exercising the hermetic tz provisioning —
  # materialization, idempotent re-runs, half-written-dir rebuilds — through
  # the feature that compiles it on linux.
  bundled-tzdb:
    name: Bundled tz database (wasmtime + bundled-tzdb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2.9.3

      - name: Run cargo clippy
        run: cargo clippy --all-targets --no-default-features --features wasmtime,bundled-tzdb -- -D warnings -W clippy::nursery

      - name: Run cargo test
        run: cargo test --release --no-default-features --features wasmtime,bundled-tzdb

      - name: Run cargo doc
        # Same rationale as the build job's doc step, for the feature set that
        # actually compiles the bundled-tzdb block: its doc comments carry
        # intra-doc links ([`tzdb_dir_complete`], [`create_tz_dirs`], ...) that
        # rustdoc only resolves when the block is compiled.
        run: cargo doc --no-deps --no-default-features --features wasmtime,bundled-tzdb
        env:
          RUSTDOCFLAGS: "-D warnings"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2.9.3
        with:
          # rust-cache prunes target/ before saving and does not understand the
          # custom target/llvm-cov-target directory, so it silently drops the
          # instrumented tree. Let it cache the registry only (prefix-key keeps
          # it off the build matrix's key) and cache the target explicitly below.
          prefix-key: "cov"
          cache-targets: false
          save-if: true

      - name: Cache llvm-cov instrumented target
        uses: actions/cache@v6.1.0
        with:
          # Persist the instrumented wasmtime/cranelift tree wholesale so only
          # changed workspace crates recompile. Key on Cargo.lock AND Cargo.toml
          # so a profile change (e.g. the deps' opt-level) rotates the key and
          # the rebuilt tree gets saved; the restore-key fallback still warms the
          # build from the previous tree.
          path: target/llvm-cov-target
          key: llvm-cov-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: llvm-cov-target-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.90.7
        with:
          tool: cargo-llvm-cov

      - name: Drop stale workspace objects
        # The cached target tree is restored wholesale and, for an exact key hit,
        # never re-saved, so it keeps the workspace crate's objects from every
        # source version built since the key was created. cargo-llvm-cov reports
        # over all of them, so a file edited since then is counted once per old
        # version and codecov sees phantom uncovered lines (the project figure
        # swung by several points on a PR that barely touched coverage). Dependency
        # artifacts are kept; only the workspace crate is rebuilt, which is cheap.
        # Neither `cargo llvm-cov clean --workspace` nor `cargo clean -p` removes
        # the stale test binaries in `deps/`: they carry hashes from an older cargo,
        # which only knows the current layout (`build/<pkg>/<hash>/out`). Those
        # executables are the workspace's own test binaries (dependencies build no
        # executables there), so delete every extension-less executable in `deps/`
        # as well, plus profile data left in the cached tree.
        #
        # A cold cache (first run on a branch) has no `deps/` yet; that means there
        # is nothing stale, so only the existing directory is searched. A `find`
        # failure on a directory that does exist still fails the step.
        run: |
          cargo clean -p googlesql --target-dir target/llvm-cov-target
          if [ -d target/llvm-cov-target/debug/deps ]; then
            find target/llvm-cov-target/debug/deps -maxdepth 1 -type f -perm -u+x ! -name '*.*' -print -delete
          fi
          rm -f target/llvm-cov-target/*.profraw target/llvm-cov-target/*.profdata target/llvm-cov-target/*-profraw-list

      - name: Generate code coverage
        # Cover the crate on the wasmtime engine: it is the reference backend and
        # its Rust source (unlike the native-ffi cdylib's opaque object code) is
        # what coverage can meaningfully instrument. `native-ffi` is the default,
        # so opt out of it explicitly here.
        run: cargo llvm-cov --workspace --no-default-features --features wasmtime --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

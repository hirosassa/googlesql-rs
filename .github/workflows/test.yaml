name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check on ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v6

      - name: Install ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings -W clippy::nursery

      - name: Run cargo test
        run: cargo test --release

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache prunes target/ before saving and does not understand the
          # custom target/llvm-cov-target directory, so it silently drops the
          # instrumented tree. Let it cache the registry only (prefix-key keeps
          # it off the build matrix's key) and cache the target explicitly below.
          prefix-key: "cov"
          cache-targets: false
          save-if: true

      - name: Cache llvm-cov instrumented target
        uses: actions/cache@v4
        with:
          # The ~20 min coverage runtime is entirely the instrumented build of
          # the wasmtime/cranelift tree. Persist it wholesale so only changed
          # workspace crates recompile. The key rotates with Cargo.lock; the
          # restore-key fallback reuses the previous tree when deps are unchanged.
          path: target/llvm-cov-target
          key: llvm-cov-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: llvm-cov-target-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

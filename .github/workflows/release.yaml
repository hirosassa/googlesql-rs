name: release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run cargo test
        run: cargo test --release

      # The source-compiled `native` feature depends on the generated `guest`
      # path-crate (~122MB, gitignored, regenerated per build). That crate is
      # never on crates.io, so `cargo publish` cannot ship it: it rejects a
      # path dependency without a version, and crates.io requires every
      # dependency to be a published crate. `native` can only ever work when
      # building from source anyway, so drop its `guest` dependency from the
      # *published* manifest (the repo keeps it for local dev and the `native`
      # CI job). Keep the `native` feature *defined* (as an empty feature) so the
      # `#[cfg(feature = "native")]` items throughout the crate stay a known cfg
      # value — otherwise `-D warnings` fails the publish verify build on
      # `unexpected_cfgs`. The `native-ffi` engine has no such dependency and
      # stays published.
      - name: Strip the source-only `native` dependency for crates.io
        run: |
          set -euo pipefail
          sed -i \
            -e '\#^guest = { path = "native/guest"#d' \
            -e 's/^native = \["dep:guest"\]/native = []/' \
            Cargo.toml
          # Fail loudly if the entries the publish depends on rewriting are still
          # in their original form (e.g. the manifest was reformatted and the
          # patterns drifted).
          if grep -qE '^guest = \{ path = "native/guest"|^native = \["dep:guest"\]' Cargo.toml; then
            echo "error: failed to strip the native/guest entries from Cargo.toml" >&2
            exit 1
          fi

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --allow-dirty: the strip step above intentionally edits Cargo.toml in
        # the checkout without committing it.
        run: cargo publish --allow-dirty
